name: Phase 22 Helix exact reproduction
on:
  workflow_dispatch:
  push:
    paths:
      - experiments/phase22/phase22.py
      - .github/workflows/phase22.yml
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - run: python experiments/phase22/phase22.py
      - name: Archive complete raw observations
        run: |
          mkdir -p results/phase22
          cp experiments/phase22/raw_results.csv experiments/phase22/summary.csv experiments/phase22/environment.json results/phase22/
          sha256sum experiments/phase22/phase22.py results/phase22/* > results/phase22/SHA256SUMS.txt
      - name: Commit raw and checksums
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase22
          if ! git diff --cached --quiet; then
            git commit -m 'Archive exact Phase 22 raw observations'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase22-helix-results
          path: results/phase22/
