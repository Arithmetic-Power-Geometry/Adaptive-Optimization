name: Phase 33 exact value-of-information ablation
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/phase33.yml
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - run: OPENBLAS_NUM_THREADS=1 python experiments/phase33/phase33.py
      - name: Archive raw observations
        run: |
          mkdir -p results/phase33
          cp experiments/phase33/raw_results.csv experiments/phase33/summary.csv experiments/phase33/environment.json results/phase33/
          sha256sum experiments/phase33/phase33.py results/phase33/* > results/phase33/SHA256SUMS.txt
      - name: Commit reproducibility data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase33
          if ! git diff --cached --quiet; then
            git commit -m 'Archive Phase 33 full raw data'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase33-full-data
          path: results/phase33/
