name: Phase 40 cross-dimensional full-rank replication
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/phase40.yml
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - run: OPENBLAS_NUM_THREADS=1 python experiments/phase40/phase40.py
      - name: Archive all raw observations
        run: |
          mkdir -p results/phase40
          cp experiments/phase40/raw_results.csv experiments/phase40/summary.csv experiments/phase40/environment.json results/phase40/
          sha256sum experiments/phase40/phase40.py results/phase40/* > results/phase40/SHA256SUMS.txt
      - name: Commit complete benchmark data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase40
          if ! git diff --cached --quiet; then
            git commit -m 'Archive Phase 40 complete raw observations'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase40-raw-and-provenance
          path: results/phase40/
