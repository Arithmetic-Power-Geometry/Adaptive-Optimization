name: Phase 3 rotated optimizer benchmark
on:
  workflow_dispatch:
  push:
    paths:
      - experiments/phase3_rotated.py
      - .github/workflows/phase3.yml
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install numpy==2.3.5 scipy==1.17.0
      - run: python experiments/phase3_rotated.py > experiments/phase3_run_log.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phase3-rotated-full-results
          path: |
            experiments/phase3_raw_results.csv
            experiments/phase3_trajectories.csv
            experiments/phase3_summary.csv
            experiments/phase3_run_log.txt
