name: Phase 27 exact COBYQA restart pilot
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/phase27.yml
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - run: OPENBLAS_NUM_THREADS=1 python experiments/phase27/phase27.py
      - name: Archive exact outputs
        run: |
          mkdir -p results/phase27
          cp experiments/phase27/raw_results.csv experiments/phase27/summary.csv experiments/phase27/environment.json results/phase27/
          sha256sum experiments/phase27/phase27.py results/phase27/* > results/phase27/SHA256SUMS.txt
      - name: Commit raw observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase27
          if ! git diff --cached --quiet; then
            git commit -m 'Archive Phase 27 exact observations'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase27-results
          path: results/phase27/
