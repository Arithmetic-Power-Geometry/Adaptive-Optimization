name: Phase 24 exact held-out replication
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/phase24.yml
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - run: python experiments/phase24/phase24.py
      - name: Save exact raw records and checksums
        run: |
          mkdir -p results/phase24
          cp experiments/phase24/raw_results.csv experiments/phase24/summary.csv experiments/phase24/environment.json results/phase24/
          sha256sum experiments/phase24/phase24.py results/phase24/* > results/phase24/SHA256SUMS.txt
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase24
          if ! git diff --cached --quiet; then
            git commit -m 'Archive complete Phase 24 raw observations'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase24-full-results
          path: results/phase24/
