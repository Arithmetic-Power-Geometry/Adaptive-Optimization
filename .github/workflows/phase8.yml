name: Phase 8 paired budget validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/phase7_heldout_targets.py'
      - 'experiments/phase8_analysis.py'
      - '.github/workflows/phase8.yml'
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Reproduce held-out optimization data
        working-directory: experiments
        run: python phase7_heldout_targets.py
      - name: Analyze paired success across five budgets
        working-directory: experiments
        run: python phase8_analysis.py
      - uses: actions/upload-artifact@v4
        with:
          name: phase8-fully-reproducible-data
          path: |
            experiments/phase7_raw_results.csv
            experiments/phase7_summary.csv
            experiments/phase8_budget_curves.csv
            experiments/phase8_paired.csv
