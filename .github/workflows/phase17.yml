name: Phase 17 exact benchmark reproduction
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/phase17.yml
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Execute exact benchmark
        run: python experiments/phase17/phase17.py
      - name: Preserve raw data and checksums
        run: |
          mkdir -p results/phase17
          cp experiments/phase17/raw_results.csv experiments/phase17/summary.csv experiments/phase17/environment.json results/phase17/
          sha256sum experiments/phase17/phase17.py results/phase17/* > results/phase17/SHA256SUMS.txt
      - name: Commit exact raw data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase17
          if ! git diff --cached --quiet; then
            git commit -m 'Commit Phase 17 raw benchmark data and hashes'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase17-raw-and-hashes
          path: results/phase17/
