name: Phase 46 gap-first replication
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/phase46.yml
permissions:
  contents: write
jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - run: OPENBLAS_NUM_THREADS=1 python experiments/phase46/phase46.py
      - name: Archive all observations and anytime traces
        run: |
          mkdir -p results/phase46
          cp experiments/phase46/raw_results.csv experiments/phase46/traces.csv experiments/phase46/summary.csv experiments/phase46/environment.json results/phase46/
          sha256sum experiments/phase46/phase46.py results/phase46/* > results/phase46/SHA256SUMS.txt
      - name: Commit complete results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase46
          if ! git diff --cached --quiet; then
            git commit -m 'Archive Phase46 full raw and anytime traces'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase46-full-results
          path: results/phase46/
