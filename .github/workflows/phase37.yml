name: Phase 37 dimension selector reproduction
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/phase37.yml
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - run: OPENBLAS_NUM_THREADS=1 python experiments/phase37/phase37.py
      - name: Archive raw observations and hashes
        run: |
          mkdir -p results/phase37
          cp experiments/phase37/raw_results.csv experiments/phase37/summary.csv experiments/phase37/environment.json results/phase37/
          sha256sum experiments/phase37/phase37.py results/phase37/* > results/phase37/SHA256SUMS.txt
      - name: Commit full results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase37
          if ! git diff --cached --quiet; then
            git commit -m 'Archive Phase 37 full benchmark observations'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase37-results
          path: results/phase37/
