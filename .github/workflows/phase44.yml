name: Phase 44 mechanism ablation
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/phase44.yml
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - run: OPENBLAS_NUM_THREADS=1 python experiments/phase44/phase44.py
      - name: Archive all raw data
        run: |
          mkdir -p results/phase44
          cp experiments/phase44/raw_results.csv experiments/phase44/summary.csv experiments/phase44/environment.json results/phase44/
          sha256sum experiments/phase44/phase44.py results/phase44/* > results/phase44/SHA256SUMS.txt
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase44
          if ! git diff --cached --quiet; then
            git commit -m 'Archive Phase44 raw ablation results'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase44-raw
          path: results/phase44/
