name: Phase 25 official COCO BBOB pilot
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/phase25_coco.yml
permissions:
  contents: write
jobs:
  bbob:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy coco-experiment
      - run: python experiments/phase25/phase25_coco.py
      - name: Preserve raw results
        run: |
          mkdir -p results/phase25
          cp experiments/phase25/coco_raw.csv results/phase25/
          sha256sum experiments/phase25/phase25_coco.py results/phase25/coco_raw.csv > results/phase25/SHA256SUMS.txt
      - name: Commit official COCO observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase25
          if ! git diff --cached --quiet; then
            git commit -m 'Archive official Phase 25 COCO BBOB pilot observations'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase25-coco-bbob
          path: results/phase25/
