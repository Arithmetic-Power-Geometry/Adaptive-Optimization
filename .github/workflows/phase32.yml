name: Phase 32 Lebesgue stratification reproduction
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/phase32.yml
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - run: OPENBLAS_NUM_THREADS=1 python experiments/phase32/phase32.py
      - name: Save complete data
        run: |
          mkdir -p results/phase32
          cp experiments/phase32/raw_results.csv experiments/phase32/summary.csv experiments/phase32/environment.json results/phase32/
          sha256sum experiments/phase32/phase32.py results/phase32/* > results/phase32/SHA256SUMS.txt
      - name: Commit full results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase32
          if ! git diff --cached --quiet; then
            git commit -m 'Archive Phase 32 raw observations'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase32-results
          path: results/phase32/
