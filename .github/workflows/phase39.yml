name: Phase 39 held-out restart replication
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/phase39.yml
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - run: OPENBLAS_NUM_THREADS=1 python experiments/phase39/phase39.py
      - name: Archive raw observations
        run: |
          mkdir -p results/phase39
          cp experiments/phase39/raw_results.csv experiments/phase39/summary.csv experiments/phase39/environment.json results/phase39/
          sha256sum experiments/phase39/phase39.py results/phase39/* > results/phase39/SHA256SUMS.txt
      - name: Commit complete results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase39
          if ! git diff --cached --quiet; then
            git commit -m 'Archive Phase 39 full held-out observations'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase39-results
          path: results/phase39/
