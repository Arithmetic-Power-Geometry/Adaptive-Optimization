name: Phase 28 ZigZag turning search reproducibility
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/phase28.yml
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - run: OPENBLAS_NUM_THREADS=1 python experiments/phase28/phase28.py
      - name: Archive raw data and checksums
        run: |
          mkdir -p results/phase28
          cp experiments/phase28/raw_results.csv experiments/phase28/summary.csv experiments/phase28/environment.json results/phase28/
          sha256sum experiments/phase28/phase28.py results/phase28/* > results/phase28/SHA256SUMS.txt
      - name: Commit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase28
          if ! git diff --cached --quiet; then
            git commit -m 'Archive Phase 28 ZigZag observations'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase28-raw
          path: results/phase28/
