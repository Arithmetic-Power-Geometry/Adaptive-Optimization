name: Phase51 exact synthetic replication gate
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/phase51_reproduce.yml
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Lock numerical dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Reproduce 200 runs and all 19308 traces
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python experiments/phase51/reproduce_phase49.py --dimension 10 --instances 1-20 --functions 1,2 --budget-mult 12 --out results/phase51
      - name: Check exact SHA256 against independently reproduced Phase49 data
        run: |
          echo '5f2a5e3891029e6e1d936a23b115c7afdbe77d5cf224a744d2146e5b27920a6e  results/phase51/raw_results.csv' | sha256sum --check
          echo 'aeed88100349703f287b4786188c20fad7e7618b1bcd05eb93e83e802ade8d5d  results/phase51/traces.csv' | sha256sum --check
          sha256sum experiments/phase51/reproduce_phase49.py results/phase51/* > results/phase51/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase51-200-run-reproduction
          path: results/phase51/
