name: Phase 30 Lebesgue probe replication
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/phase30.yml
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - run: OPENBLAS_NUM_THREADS=1 python experiments/phase30/phase30.py
      - name: Archive raw observations and hashes
        run: |
          mkdir -p results/phase30
          cp experiments/phase30/raw_results.csv experiments/phase30/summary.csv experiments/phase30/environment.json results/phase30/
          sha256sum experiments/phase30/phase30.py results/phase30/* > results/phase30/SHA256SUMS.txt
      - name: Commit raw results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase30
          if ! git diff --cached --quiet; then
            git commit -m 'Archive Phase 30 Lebesgue probe raw results'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase30-raw
          path: results/phase30/
