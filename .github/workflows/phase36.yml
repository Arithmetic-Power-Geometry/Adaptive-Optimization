name: Phase 36 screened subspace reproduction
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/phase36.yml
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - run: OPENBLAS_NUM_THREADS=1 python experiments/phase36/phase36.py
      - name: Archive raw results and hashes
        run: |
          mkdir -p results/phase36
          cp experiments/phase36/raw_results.csv experiments/phase36/summary.csv experiments/phase36/environment.json results/phase36/
          sha256sum experiments/phase36/phase36.py results/phase36/* > results/phase36/SHA256SUMS.txt
      - name: Commit raw data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase36
          if ! git diff --cached --quiet; then
            git commit -m 'Archive Phase 36 full benchmark observations'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase36-complete
          path: results/phase36/
