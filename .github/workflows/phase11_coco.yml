name: Phase 11 official COCO BBOB benchmark
on:
  workflow_dispatch:
  push:
    paths:
      - experiments/phase11_coco_bbob.py
      - .github/workflows/phase11_coco.yml
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install benchmark dependencies
        run: python -m pip install numpy scipy coco-experiment cma
      - name: Run official BBOB pilot
        run: python experiments/phase11_coco_bbob.py --instances 1-3 --dimensions 2,5 --budget-factor 40 --out results/phase11_coco
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase11-coco-bbob-results
          path: results/phase11_coco/
