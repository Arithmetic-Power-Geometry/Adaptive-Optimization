name: Phase 38 independent subspace restart replication
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/phase38.yml
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - run: OPENBLAS_NUM_THREADS=1 python experiments/phase38/phase38.py
      - name: Archive raw observations
        run: |
          mkdir -p results/phase38
          cp experiments/phase38/raw_results.csv experiments/phase38/summary.csv experiments/phase38/environment.json results/phase38/
          sha256sum experiments/phase38/phase38.py results/phase38/* > results/phase38/SHA256SUMS.txt
      - name: Commit full raw results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase38
          if ! git diff --cached --quiet; then
            git commit -m 'Archive Phase 38 raw observations'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase38-full-results
          path: results/phase38/
