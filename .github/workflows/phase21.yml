name: Phase 21 exact reproduction
on:
  workflow_dispatch:
  push:
    paths:
      - experiments/phase21/phase21.py
      - .github/workflows/phase21.yml
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - run: python experiments/phase21/phase21.py
      - name: Copy results and SHA hashes
        run: |
          mkdir -p results/phase21
          cp experiments/phase21/raw_results.csv experiments/phase21/summary.csv experiments/phase21/environment.json results/phase21/
          sha256sum experiments/phase21/phase21.py results/phase21/* > results/phase21/SHA256SUMS.txt
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase21
          if ! git diff --cached --quiet; then
            git commit -m 'Archive Phase 21 exact raw results'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase21-results
          path: results/phase21/
