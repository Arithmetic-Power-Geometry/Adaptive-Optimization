name: Phase 26 numerical gradient ablation
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/phase26.yml
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - run: python experiments/phase26/phase26.py
      - run: |
          mkdir -p results/phase26
          cp experiments/phase26/raw_results.csv experiments/phase26/summary.csv experiments/phase26/environment.json results/phase26/
          sha256sum experiments/phase26/phase26.py results/phase26/* > results/phase26/SHA256SUMS.txt
      - name: Commit all raw results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase26
          if ! git diff --cached --quiet; then
            git commit -m 'Archive exact Phase 26 raw results'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase26-complete
          path: results/phase26/
