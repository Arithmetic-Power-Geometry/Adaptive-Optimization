name: Phase 42 differential evolution baseline reproduction
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/phase42.yml
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Execute all dimensions
        run: |
          for d in 8 20 40; do
            OPENBLAS_NUM_THREADS=1 python experiments/phase42/phase42.py --dimension "$d"
          done
      - name: Archive raw data and checksums
        run: |
          mkdir -p results/phase42
          cp experiments/phase42/raw_d*.csv results/phase42/
          sha256sum experiments/phase42/phase42.py results/phase42/* > results/phase42/SHA256SUMS.txt
      - name: Commit raw observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase42
          if ! git diff --cached --quiet; then
            git commit -m 'Archive Phase 42 complete raw results'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase42-raw-results
          path: results/phase42/
