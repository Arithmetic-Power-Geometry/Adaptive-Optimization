name: Phase 34 dimension-stress benchmark
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/phase34.yml
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - run: OPENBLAS_NUM_THREADS=1 python experiments/phase34/phase34.py
      - name: Archive exact raw observations
        run: |
          mkdir -p results/phase34
          cp experiments/phase34/raw_results.csv experiments/phase34/summary.csv experiments/phase34/environment.json results/phase34/
          sha256sum experiments/phase34/phase34.py results/phase34/* > results/phase34/SHA256SUMS.txt
      - name: Commit full raw results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase34
          if ! git diff --cached --quiet; then
            git commit -m 'Archive Phase 34 high-dimensional benchmark raw data'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase34-full-results
          path: results/phase34/
