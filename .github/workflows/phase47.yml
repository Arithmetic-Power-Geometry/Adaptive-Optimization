name: Phase 47 diagnostic-gate negative result
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/phase47.yml
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Reproduce 48 trials
        run: OPENBLAS_NUM_THREADS=1 python experiments/phase47/phase47.py
      - name: Archive raw observations, traces and checksums
        run: |
          mkdir -p results/phase47
          cp experiments/phase47/raw_results.csv experiments/phase47/traces.csv experiments/phase47/summary.csv experiments/phase47/environment.json results/phase47/
          sha256sum experiments/phase47/phase47.py results/phase47/* > results/phase47/SHA256SUMS.txt
      - name: Commit observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase47
          if ! git diff --cached --quiet; then
            git commit -m 'Archive Phase47 raw data and anytime traces'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase47-full-results
          path: results/phase47/
