name: Phase 41 cross-dimensional reproduction
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/phase41.yml
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Run five dimensions
        run: |
          for d in 4 8 20 40 80; do
            OPENBLAS_NUM_THREADS=1 python experiments/phase41/phase41.py --dimension "$d"
          done
      - name: Archive full raw observations and provenance
        run: |
          mkdir -p results/phase41
          cp experiments/phase41/raw_d*.csv results/phase41/
          sha256sum experiments/phase41/phase41.py results/phase41/* > results/phase41/SHA256SUMS.txt
      - name: Commit complete raw data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase41
          if ! git diff --cached --quiet; then
            git commit -m 'Archive Phase 41 full raw benchmark observations'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase41-complete
          path: results/phase41/
