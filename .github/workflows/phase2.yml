name: Phase 2 strict-budget optimization benchmark
on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/phase2_strict_budget.py'
      - '.github/workflows/phase2.yml'
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Run strict-budget comparisons
        run: python experiments/phase2_strict_budget.py > experiments/phase2_run_log.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phase2-strict-budget-results
          path: |
            experiments/raw_results.csv
            experiments/trajectories.csv
            experiments/summary.csv
            experiments/phase2_run_log.txt
