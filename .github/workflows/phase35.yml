name: Phase 35 intrinsic dimension stress replication
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/phase35.yml
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - run: OPENBLAS_NUM_THREADS=1 python experiments/phase35/phase35.py
      - name: Archive raw observations and hashes
        run: |
          mkdir -p results/phase35
          cp experiments/phase35/raw_results.csv experiments/phase35/summary.csv experiments/phase35/environment.json results/phase35/
          sha256sum experiments/phase35/phase35.py results/phase35/* > results/phase35/SHA256SUMS.txt
      - name: Commit full raw data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase35
          if ! git diff --cached --quiet; then
            git commit -m 'Archive Phase 35 full raw benchmark results'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase35-complete
          path: results/phase35/
