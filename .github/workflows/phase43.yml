name: Phase 43 equal-domain independent replication
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/phase43.yml
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Run 144 optimization trials
        run: |
          for d in 8 20; do
            OPENBLAS_NUM_THREADS=1 python experiments/phase43/phase43.py --dimension "$d"
          done
      - name: Save raw observations and hashes
        run: |
          mkdir -p results/phase43
          cp experiments/phase43/raw_d*.csv results/phase43/
          sha256sum experiments/phase43/phase43.py results/phase43/* > results/phase43/SHA256SUMS.txt
      - name: Commit raw results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase43
          if ! git diff --cached --quiet; then
            git commit -m 'Archive Phase 43 full raw results'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase43-raw
          path: results/phase43/
