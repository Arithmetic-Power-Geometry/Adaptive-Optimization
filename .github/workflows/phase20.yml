name: Phase 20 APG exponent ablation
on:
  workflow_dispatch:
  push:
    paths:
      - experiments/phase20/phase20.py
      - .github/workflows/phase20.yml
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - run: python experiments/phase20/phase20.py
      - name: Save exact raw and summary data
        run: |
          mkdir -p results/phase20
          cp experiments/phase20/raw_results.csv experiments/phase20/summary.csv experiments/phase20/environment.json results/phase20/
          sha256sum experiments/phase20/phase20.py results/phase20/* > results/phase20/SHA256SUMS.txt
      - name: Commit reproducibility data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase20
          if ! git diff --cached --quiet; then
            git commit -m 'Archive Phase 20 raw ablation results and SHA256'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase20-raw-data
          path: results/phase20/
