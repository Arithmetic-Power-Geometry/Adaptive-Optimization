name: Phase 4 coupling experiment
on:
  workflow_dispatch:
  push:
    paths:
      - experiments/phase4_coupling.py
      - .github/workflows/phase4.yml
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - run: python experiments/phase4_coupling.py > experiments/phase4_run_log.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phase4-complete-results
          path: |
            experiments/phase4_raw_results.csv
            experiments/phase4_summary.csv
            experiments/phase4_trajectories.csv
            experiments/phase4_run_log.txt
