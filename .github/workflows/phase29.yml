name: Phase 29 exponential ZigZag exact reproducibility
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/phase29.yml
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - run: OPENBLAS_NUM_THREADS=1 python experiments/phase29/phase29.py
      - name: Archive full observations
        run: |
          mkdir -p results/phase29
          cp experiments/phase29/raw_results.csv experiments/phase29/summary.csv experiments/phase29/environment.json results/phase29/
          sha256sum experiments/phase29/phase29.py results/phase29/* > results/phase29/SHA256SUMS.txt
      - name: Commit raw data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase29
          if ! git diff --cached --quiet; then
            git commit -m 'Archive Phase 29 exponential ZigZag raw results'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase29-complete-results
          path: results/phase29/
